<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>메이플랜드 수익 측정기</title>
  <style>
    body {
      background-color: #121212;
      color: #f5f5f5;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 2rem;
      max-width: 600px;
      margin: auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 2rem;
    }
    label {
      display: block;
      margin: 1rem 0 0.5rem;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 0.5rem;
      border: none;
      border-radius: 5px;
      background-color: #1e1e1e;
      color: white;
      font-size: 1rem;
    }
    button {
      margin-top: 1.5rem;
      padding: 0.75rem;
      width: 100%;
      background-color: #03dac6;
      border: none;
      color: #000;
      font-weight: bold;
      font-size: 1.1rem;
      border-radius: 5px;
      cursor: pointer;
    }
    .result {
      margin-top: 2rem;
      padding: 1rem;
      background-color: #1f1f1f;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h1>메이플랜드 수익 측정기</h1>
  <label>시작 경험치</label>
  <input type="number" id="startExp" placeholder="예: 1200000000" />

  <label>종료 경험치</label>
  <input type="number" id="endExp" placeholder="예: 1220000000" />

  <label>시작 레벨</label>
  <input type="number" id="startLevel" placeholder="예: 50" />

  <label>종료 레벨</label>
  <input type="number" id="endLevel" placeholder="예: 52" />

  <label>시작 메소</label>
  <input type="number" id="startMesos" placeholder="예: 400000000" />

  <label>종료 메소</label>
  <input type="number" id="endMesos" placeholder="예: 410000000" />

  <label>소요 시간 (분)</label>
  <input type="number" id="duration" placeholder="예: 60" />

  <button onclick="calculate()">결과 보기</button>

  <div class="result" id="result"></div>

  <script>
    function calculate() {
      const startExp = parseInt(document.getElementById('startExp').value);
      const endExp = parseInt(document.getElementById('endExp').value);
      const startLevel = parseInt(document.getElementById('startLevel').value);
      const endLevel = parseInt(document.getElementById('endLevel').value);
      const startMesos = parseInt(document.getElementById('startMesos').value);
      const endMesos = parseInt(document.getElementById('endMesos').value);
      const duration = parseInt(document.getElementById('duration').value);

      if (isNaN(startExp) || isNaN(endExp) || isNaN(startLevel) || isNaN(endLevel) || isNaN(startMesos) || isNaN(endMesos) || isNaN(duration) || duration <= 0) {
        document.getElementById('result').innerText = '모든 값을 올바르게 입력해 주세요.';
        return;
      }

      const gainExp = endExp - startExp;
      const gainMesos = endMesos - startMesos;
      const expPerHour = (gainExp * 60 / duration).toFixed(0);
      const mesosPerHour = (gainMesos * 60 / duration).toFixed(0);

      document.getElementById('result').innerHTML = `
        ✅ 총 획득 경험치: ${gainExp.toLocaleString()}<br/>
        ✅ 시간당 경험치: ${parseInt(expPerHour).toLocaleString()}<br/>
        ✅ 시작 레벨: ${startLevel}<br/>
        ✅ 종료 레벨: ${endLevel}<br/><br/>
        💰 총 획득 메소: ${gainMesos.toLocaleString()}<br/>
        💰 시간당 메소: ${parseInt(mesosPerHour).toLocaleString()}<br/>
      `;
    }
  </script>
</body>
</html>
